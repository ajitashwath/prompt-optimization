[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-optimization"
version = "0.1.0"
description = "Self-improving prompt optimization pipeline using MIPROv2 and GEPA"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",

    # LLM provider abstraction
    "litellm>=1.40",

    # NLP / embeddings for PII + dedup
    "spacy>=3.7",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",

    # Bayesian search (MIPROv2)
    "optuna>=3.6",

    # Statistics (gate)
    "scipy>=1.13",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",

    # Web UI (labeling studio)
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",

    # CLI
    "typer[all]>=0.12",
    "rich>=13.7",

    # Scheduler (feedback loop)
    "apscheduler>=3.10",

    # Database / storage
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",

    # HTTP (async LLM calls)
    "httpx>=0.27",
    "tenacity>=8.3",

    # Utilities
    "tiktoken>=0.7",
    "xxhash>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipykernel>=6.29",
]

[project.scripts]
prompt-opt = "prompt_opt.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["prompt_opt"]
